[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskflow-cli"
version = "0.1.0"
description = "Command-line client for TaskFlow"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",   
    "mypy>=1.11",  
] 

[project.scripts]
tflowctl = "taskflow_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/taskflow_cli"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"] 
[tool.ruff]       
line-length = 100      
target-version = "py310"
                 
[tool.ruff.lint] 
select = [   
    "E", 
    "F", 
    "I", 
    "B", 
    "UP",
]         
ignore = [ 
    "E501", 
]
                               
[tool.ruff.lint.per-file-ignores] 
"tests/**" = ["B011"]
"src/taskflow_cli/commands/**" = ["B008"]

[tool.mypy]             
python_version = "3.10"      
strict = false             
warn_redundant_casts = true 
warn_unused_ignores = true   
warn_return_any = true 
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true  

[[tool.mypy.overrides]]     
module = "tests.*"
ignore_errors = true
[[tool.mypy.overrides]]
module = "taskflow_cli.api.*"
warn_return_any = false
