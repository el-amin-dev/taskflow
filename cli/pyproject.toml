[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskflow-cli"
version = "0.1.0"
description = "Command-line client for TaskFlow"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",   
] 

[project.scripts]
tflowctl = "taskflow_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/taskflow_cli"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"] 
[tool.ruff]       
line-length = 100      
target-version = "py310"
                 
[tool.ruff.lint] 
select = [   
    "E", 
    "F", 
    "I", 
    "B", 
    "UP",
]         
ignore = [ 
    "E501", 
]
                               
[tool.ruff.lint.per-file-ignores] 
"tests/**" = ["B011"]
"src/taskflow_cli/commands/**" = ["B008"]
